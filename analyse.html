<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Master Hub — Analyse</title>
    <meta name="theme-color" content="#0f0f14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Master Hub — Vidéos d'analyse à rejouer avec EQ et vitesse.">

    <style>
        :root {
            --bg: #0f0f14;
            --bg-card: #1a1a24;
            --bg-card-hover: #22222f;
            --text: #eee;
            --text-muted: #888;
            --text-faint: #666;
            --v: #8B6FE8;
            --v-soft: rgba(139, 111, 232, 0.08);
            --v-soft-stronger: rgba(139, 111, 232, 0.14);
            --v-border: rgba(139, 111, 232, 0.3);
            --border1: rgba(255, 255, 255, 0.08);
            --radius: 16px;
            --tap-min: 48px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh; min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
        }

        #bg-canvas {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative; z-index: 1;
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 16px 40px;
            display: flex; flex-direction: column;
            min-height: 100vh; min-height: 100dvh;
        }

        .back-link {
            align-self: flex-start;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            padding: 6px 8px;
            margin-bottom: 8px;
            transition: color 0.15s;
        }
        .back-link:hover { color: var(--text); }

        .header {
            text-align: center;
            padding: 12px 0 4px;
        }
        .header h1 {
            font-size: 1.6rem; font-weight: 700;
            letter-spacing: -0.02em;
            color: #fff;
        }
        .header .subtitle {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ── Liste vidéos ────────────────────────────────────── */
        .videos-list {
            display: flex; flex-direction: column;
            gap: 12px;
            margin-top: 28px;
        }

        .video-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border1);
            border-radius: var(--radius);
            padding: 14px 16px;
            cursor: pointer;
            text-align: left;
            color: inherit;
            font-family: inherit;
            min-height: var(--tap-min);
            transition: background 0.15s, transform 0.1s, border-color 0.15s;
            width: 100%;
        }
        .video-card:active {
            transform: scale(0.98);
            background: var(--bg-card-hover);
        }
        @media (hover: hover) {
            .video-card:hover {
                background: var(--bg-card-hover);
                border-color: var(--v-border);
            }
        }
        .video-card-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: var(--v-soft-stronger);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-size: 1.2rem;
        }
        .video-card-body {
            flex: 1;
            min-width: 0;
        }
        .video-card-title {
            font-size: 0.98rem;
            font-weight: 600;
            line-height: 1.3;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .video-card-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
            font-feature-settings: "tnum";
        }
        .video-card-arrow {
            color: var(--text-faint);
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .empty-state {
            margin-top: 40px;
            padding: 40px 24px;
            text-align: center;
            background: var(--bg-card);
            border: 1px dashed var(--border1);
            border-radius: var(--radius);
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.5;
        }
        .empty-state .ico {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 12px;
            opacity: 0.7;
        }
        .empty-state strong {
            color: var(--text);
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        .loading {
            margin-top: 40px;
            padding: 40px 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* ── Modal player ────────────────────────────────────── */
        .player-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: none;
            align-items: center; justify-content: center;
            padding: 16px;
        }
        .player-overlay.show { display: flex; }
        .player-box {
            width: 100%;
            max-width: 920px;
            background: #0c0c12;
            border: 1px solid var(--border1);
            border-radius: 14px;
            padding: 16px;
            display: flex; flex-direction: column;
            gap: 12px;
            max-height: calc(100vh - 32px);
            max-height: calc(100dvh - 32px);
            overflow-y: auto;
        }
        .player-head {
            display: flex; justify-content: space-between; align-items: center;
            gap: 12px;
        }
        .player-title {
            font-size: 1rem; font-weight: 600;
            flex: 1; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .player-close {
            background: var(--bg-card);
            border: 1px solid var(--border1);
            color: var(--text-muted);
            border-radius: 8px;
            width: 36px; height: 36px;
            font-size: 1.1rem;
            cursor: pointer;
            font-family: inherit;
            transition: color 0.15s, background 0.15s;
        }
        .player-close:hover {
            color: var(--text);
            background: var(--bg-card-hover);
        }
        .player-video {
            width: 100%;
            background: black;
            border-radius: 8px;
            display: block;
            max-height: 70vh;
        }
        .player-note {
            font-size: 0.75rem;
            color: var(--text-faint);
            font-feature-settings: "tnum";
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <a id="back-link" href="/" class="back-link">&larr; Retour</a>

        <header class="header">
            <h1>🎬 Analyse</h1>
            <p class="subtitle">Vidéos à rejouer avec EQ et vitesse</p>
        </header>

        <div id="content">
            <div class="loading">Chargement…</div>
        </div>
    </div>

    <!-- ── Modal player ── -->
    <div class="player-overlay" id="player-overlay">
        <div class="player-box">
            <div class="player-head">
                <div class="player-title" id="player-title">…</div>
                <button id="player-close" class="player-close" aria-label="Fermer">&times;</button>
            </div>
            <video id="player-video" class="player-video" controls preload="metadata" playsinline></video>
            <div class="player-note">EQ 3 bandes &amp; contrôle de vitesse arriveront prochainement.</div>
        </div>
    </div>

    <script src="/assets/js/eleve-guard.js"></script>
    <script>
    'use strict';

    function escapeHtml(s) {
        if (s == null) return '';
        var d = document.createElement('div');
        d.textContent = String(s);
        return d.innerHTML;
    }
    function escapeAttr(s) {
        return String(s == null ? '' : s).replace(/"/g, '&quot;');
    }
    function fmtDuration(sec) {
        if (!sec || sec <= 0) return '—';
        var m = Math.floor(sec / 60);
        var s = Math.floor(sec % 60);
        return m + ':' + String(s).padStart(2, '0');
    }

    var ELEVE_SLUG = null;

    function renderEmpty() {
        document.getElementById('content').innerHTML =
            '<div class="empty-state">' +
                '<span class="ico">🎬</span>' +
                '<strong>Aucune vidéo pour le moment.</strong>' +
                'Demande à ton coach de t\'en envoyer.' +
            '</div>';
    }

    function renderError(msg) {
        document.getElementById('content').innerHTML =
            '<div class="empty-state"><strong>Oups.</strong>' + escapeHtml(msg || 'Impossible de charger les vidéos.') + '</div>';
    }

    function renderList(items) {
        if (!items || !items.length) { renderEmpty(); return; }
        var html = '<div class="videos-list">';
        for (var i = 0; i < items.length; i++) {
            var v = items[i];
            html +=
                '<button type="button" class="video-card" data-id="' + escapeAttr(v.id) + '">' +
                    '<div class="video-card-icon">🎬</div>' +
                    '<div class="video-card-body">' +
                        '<div class="video-card-title">' + escapeHtml(v.title || 'Sans titre') + '</div>' +
                        '<div class="video-card-meta">' + escapeHtml(fmtDuration(v.durationSeconds)) + '</div>' +
                    '</div>' +
                    '<span class="video-card-arrow">&rsaquo;</span>' +
                '</button>';
        }
        html += '</div>';
        document.getElementById('content').innerHTML = html;

        document.querySelectorAll('.video-card').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var id = btn.getAttribute('data-id');
                var v = items.find(function (x) { return x.id === id; });
                if (v) openPlayer(v);
            });
        });
    }

    function openPlayer(video) {
        var overlay = document.getElementById('player-overlay');
        var titleEl = document.getElementById('player-title');
        var videoEl = document.getElementById('player-video');
        titleEl.textContent = video.title || 'Vidéo';
        videoEl.src = video.streamUrl || ('/api/analyse/' + encodeURIComponent(video.id) + '/stream');
        overlay.classList.add('show');
        // Tente la lecture (l'autoplay peut être bloqué par le navigateur sur certains contextes)
        try { videoEl.play().catch(function () {}); } catch (e) {}
    }

    function closePlayer() {
        var overlay = document.getElementById('player-overlay');
        var videoEl = document.getElementById('player-video');
        try { videoEl.pause(); } catch (e) {}
        videoEl.removeAttribute('src');
        videoEl.load();
        overlay.classList.remove('show');
    }

    document.getElementById('player-close').addEventListener('click', closePlayer);
    document.getElementById('player-overlay').addEventListener('click', function (e) {
        if (e.target.id === 'player-overlay') closePlayer();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            var overlay = document.getElementById('player-overlay');
            if (overlay.classList.contains('show')) closePlayer();
        }
    });

    (async function init() {
        var params = new URLSearchParams(window.location.search);
        var slug = params.get('eleve');
        slug = slug ? slug.toLowerCase() : null;

        if (!(await window.requireValidEleve(slug))) return;
        ELEVE_SLUG = slug;

        document.getElementById('back-link').href = '/' + slug;

        try {
            var r = await fetch(
                '/api/eleves/' + encodeURIComponent(slug) + '/analyse',
                { credentials: 'include' }
            );
            if (!r.ok) {
                if (r.status === 401 || r.status === 403) {
                    window.location.replace('/');
                    return;
                }
                renderError('Erreur ' + r.status);
                return;
            }
            var j = await r.json();
            var items = Array.isArray(j.items) ? j.items : [];
            renderList(items);
        } catch (e) {
            renderError(e && e.message);
        }
    })();
    </script>

    <script>
    // ── Fond animé — touches piano flottantes (cohérent avec /outils) ──
    (function () {
        var canvas = document.getElementById("bg-canvas");
        var ctx = canvas.getContext("2d");
        var particles = [];
        var COUNT = 18;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        function createParticle() {
            var w = 6 + Math.random() * 4;
            var h = 18 + Math.random() * 10;
            return {
                x: Math.random() * canvas.width,
                y: canvas.height + h,
                w: w, h: h, r: 2,
                speed: 0.15 + Math.random() * 0.35,
                opacity: 0.04 + Math.random() * 0.04,
                drift: (Math.random() - 0.5) * 0.3
            };
        }
        for (var i = 0; i < COUNT; i++) {
            var p = createParticle();
            p.y = Math.random() * canvas.height;
            particles.push(p);
        }
        function drawRoundRect(x, y, w, h, r, alpha) {
            ctx.globalAlpha = alpha;
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
        }
        var rafId = null;
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (var i = 0; i < particles.length; i++) {
                var p = particles[i];
                p.y -= p.speed;
                p.x += p.drift;
                drawRoundRect(p.x, p.y, p.w, p.h, p.r, p.opacity);
                if (p.y + p.h < 0) particles[i] = createParticle();
            }
            rafId = requestAnimationFrame(animate);
        }
        animate();
        var stopAnim = function () {
            if (rafId != null) { cancelAnimationFrame(rafId); rafId = null; }
            window.removeEventListener("resize", resize);
        };
        window.addEventListener("beforeunload", stopAnim);
        window.addEventListener("pagehide", stopAnim);
    })();
    </script>

</body>
