    <style>
        /* Tokens de la maquette « Fiches » (propres à cette page, hors design-system.css) */
        :root {
            --n-bg: #0E0E16;
            --n-surface: #16151F;
            --n-surface-2: #13121B;
            --n-surface-hover: #1C1B27;
            --n-accent-soft: #221D33;
            --n-violet: #7255DC;
            --n-violet-text: #B7A4F5;
            --n-violet-light: #D4C9FA;
            --n-violet-pale: #C9BBF8;
            --n-text: #ECEAF4;
            --n-text-2: #D9D6E6;
            --n-text-3: #A6A3B8;
            --n-text-soon: #C4C1D3;
            --n-text-off: #8E8AA3;
            --n-icon-off: #6E6A84;
            --n-white: #FFFFFF;
            --n-key-white: #F1EFF7;
            --n-key-black: #1A1922;
            --n-danger: #F2A8A0;
            --n-border: #2A2838;
            --n-border-2: #1F1D2A;
            --n-border-3: #24222F;
            --n-border-4: #2E2B3D;
            --n-check-border: #4A4760;
            --n-handle: #3A3750;
            --n-backdrop: rgba(5, 5, 10, 0.6);

            --n-serif: 'Cormorant Garamond', Georgia, serif;
            --n-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --n-mono: 'DM Mono', ui-monospace, monospace;

            --n-r-sm: 9px;
            --n-r-md: 12px;
            --n-r-lg: 14px;
            --n-r-xl: 16px;
            --n-r-sheet: 24px;
            --n-r-pill: 999px;

            --n-pad-x: 20px;
            --n-tap: 44px;
            --n-max-w: 480px;

            --n-ease: cubic-bezier(.2, .7, .2, 1);
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body { margin: 0; height: 100%; }

        body {
            background: var(--n-bg);
            color: var(--n-text);
            font-family: var(--n-sans);
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%;
        }

        a { color: var(--n-violet-text); }
        button { font-family: inherit; }
        :focus-visible { outline: 2px solid var(--n-violet-light); outline-offset: 2px; }

        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }

        /* ─── Cadre : une colonne plein écran, centrée sur desktop ─── */
        .app {
            position: relative;
            max-width: var(--n-max-w);
            margin: 0 auto;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .kicker {
            font-family: var(--n-mono);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--n-text-3);
        }

        .icon-btn {
            flex: none;
            width: var(--n-tap);
            height: var(--n-tap);
            border-radius: var(--n-r-md);
            border: 1px solid var(--n-border);
            background: var(--n-surface);
            color: var(--n-text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            cursor: pointer;
            text-decoration: none;
        }
        .icon-btn:hover { color: var(--n-text); }

        /* ─── Animations (transform / opacity uniquement) ─── */
        @keyframes n-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .fu { animation: n-rise .45s var(--n-ease) both; }
        .d1 { animation-delay: .06s; } .d2 { animation-delay: .12s; } .d3 { animation-delay: .18s; }
        .d4 { animation-delay: .24s; } .d5 { animation-delay: .3s; } .d6 { animation-delay: .36s; }
        .press { transition: transform .12s ease; }
        .press:active { transform: scale(.97); }

        /* ─── Bibliothèque ─── */
        .lib-head {
            flex: none;
            padding: 18px var(--n-pad-x) 12px;
            padding-top: calc(18px + env(safe-area-inset-top));
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-bottom: 1px solid var(--n-surface-hover);
        }
        .lib-title-row { display: flex; align-items: center; gap: 12px; }
        .lib-title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
        .lib-title h1 {
            margin: 0;
            font-family: var(--n-serif);
            font-size: 34px;
            line-height: 1;
            font-weight: 700;
        }
        .lib-count { align-self: flex-end; font-family: var(--n-mono); font-size: 12px; color: var(--n-text-3); white-space: nowrap; }

        .search {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 48px;
            padding: 0 14px;
            border-radius: var(--n-r-lg);
            background: var(--n-surface);
            border: 1px solid var(--n-border);
        }
        .search:focus-within { border-color: var(--n-violet); }
        .search input {
            flex: 1;
            min-width: 0;
            height: var(--n-tap);
            border: 0;
            outline: none;
            background: transparent;
            color: var(--n-text);
            font-family: var(--n-sans);
            font-size: 16px;
        }
        /* champ en 16px (pas de zoom iOS) ; placeholder plus petit pour tenir en entier */
        .search input::placeholder { color: var(--n-text-3); opacity: 1; font-size: 14px; }
        .search input::-webkit-search-cancel-button { filter: invert(.7); }

        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin: 0 calc(-1 * var(--n-pad-x));
            padding: 4px var(--n-pad-x);
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            position: relative;
            flex: none;
            height: 36px;
            padding: 0 14px;
            border-radius: var(--n-r-pill);
            border: 1px solid var(--n-border);
            background: var(--n-surface);
            color: var(--n-text-2);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        /* zone de tap portée à 44px sans changer le visuel */
        .chip::after { content: ""; position: absolute; left: 0; right: 0; top: -4px; bottom: -4px; }
        .chip[aria-pressed="true"] { background: var(--n-violet); border-color: var(--n-violet); color: var(--n-white); }

        .lib-list {
            flex: 1;
            overflow-y: auto;
            padding: 14px var(--n-pad-x) calc(24px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 18px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .lib-list::-webkit-scrollbar { width: 0; }

        .resume {
            flex: none;
            text-decoration: none;
            color: var(--n-text);
            border-radius: var(--n-r-xl);
            padding: 14px 16px;
            background: var(--n-accent-soft);
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .resume:hover { color: var(--n-text); }
        .resume-icon {
            flex: none;
            width: 40px;
            height: 40px;
            border-radius: var(--n-r-md);
            background: var(--n-violet);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .resume-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .resume-kicker { font-size: 12px; color: var(--n-violet-pale); font-weight: 600; }
        .resume-title { font-size: 16px; font-weight: 700; }
        .resume-progress { font-size: 12px; color: var(--n-text-3); }

        .group { display: flex; flex-direction: column; gap: 6px; }
        .group-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px; }
        .group-head h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--n-violet-light); }
        .group-count { font-family: var(--n-mono); font-size: 11px; color: var(--n-text-3); }
        .group-list {
            list-style: none;
            margin: 0;
            padding: 0;
            border-radius: var(--n-r-lg);
            background: var(--n-surface-2);
            border: 1px solid var(--n-border-2);
            overflow: hidden;
        }
        .group-list li + li { border-top: 1px solid var(--n-border-2); }
        .row {
            min-height: 52px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--n-text);
        }
        a.row:hover { background: var(--n-surface-hover); color: var(--n-text); }
        .row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .row-name { font-size: 15px; font-weight: 600; }
        .row-ready { font-size: 12px; color: var(--n-violet-text); }
        .row-soon .row-name { font-weight: 400; color: var(--n-text-soon); }
        .soon-badge {
            flex: none;
            font-size: 11px;
            font-weight: 600;
            color: var(--n-text-off);
            padding: 3px 8px;
            border-radius: var(--n-r-pill);
            border: 1px solid var(--n-border);
        }

        .empty {
            padding: 40px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
        }
        .empty-title { font-size: 15px; font-weight: 600; }
        .empty-text { font-size: 13px; color: var(--n-text-3); }
        .btn-ghost {
            margin-top: 6px;
            min-height: var(--n-tap);
            padding: 0 18px;
            border-radius: var(--n-r-md);
            border: 1px solid var(--n-border-4);
            background: var(--n-surface);
            color: var(--n-text);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .page-msg {
            margin: auto;
            padding: 24px var(--n-pad-x);
            text-align: center;
            color: var(--n-text-3);
            font-size: 14px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>

    <main id="app" class="app" aria-busy="true"></main>

    <script src="/notions.js"></script>
