<html lang="fr">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Tokens de la maquette « Fiches » (propres à cette page, hors design-system.css) */
        :root {
            --n-bg: #0E0E16;
            --n-surface: #16151F;
            --n-surface-2: #13121B;
            --n-surface-hover: #1C1B27;
            --n-accent-soft: #221D33;
            --n-violet: #7255DC;
            --n-violet-text: #B7A4F5;
            --n-violet-light: #D4C9FA;
            --n-violet-pale: #C9BBF8;
            --n-text: #ECEAF4;
            --n-text-2: #D9D6E6;
            --n-text-3: #A6A3B8;
            --n-text-soon: #C4C1D3;
            --n-text-off: #8E8AA3;
            --n-icon-off: #6E6A84;
            --n-white: #FFFFFF;
            --n-key-white: #F1EFF7;
            --n-key-black: #1A1922;
            --n-danger: #F2A8A0;
            --n-border: #2A2838;
            --n-border-2: #1F1D2A;
            --n-border-3: #24222F;
            --n-border-4: #2E2B3D;
            --n-check-border: #4A4760;
            --n-handle: #3A3750;
            --n-backdrop: rgba(5, 5, 10, 0.6);

            --n-serif: 'Cormorant Garamond', Georgia, serif;
            --n-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --n-mono: 'DM Mono', ui-monospace, monospace;

            --n-r-sm: 9px;
            --n-r-md: 12px;
            --n-r-lg: 14px;
            --n-r-xl: 16px;
            --n-r-sheet: 24px;
            --n-r-pill: 999px;

            --n-pad-x: 20px;
            --n-tap: 44px;
            --n-max-w: 480px;

            --n-ease: cubic-bezier(.2, .7, .2, 1);
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body { margin: 0; height: 100%; }

        body {
            background: var(--n-bg);
            color: var(--n-text);
            font-family: var(--n-sans);
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%;
        }

        a { color: var(--n-violet-text); }
        button { font-family: inherit; }
        :focus-visible { outline: 2px solid var(--n-violet-light); outline-offset: 2px; }

        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }

        /* ─── Cadre : une colonne plein écran, centrée sur desktop ─── */
        .app {
            position: relative;
            max-width: var(--n-max-w);
            margin: 0 auto;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .kicker {
            font-family: var(--n-mono);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--n-text-3);
        }

        .icon-btn {
            flex: none;
            width: var(--n-tap);
            height: var(--n-tap);
            border-radius: var(--n-r-md);
            border: 1px solid var(--n-border);
            background: var(--n-surface);
            color: var(--n-text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            cursor: pointer;
            text-decoration: none;
        }
        .icon-btn:hover { color: var(--n-text); }

        /* ─── Animations (transform / opacity uniquement) ─── */
        @keyframes n-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .fu { animation: n-rise .45s var(--n-ease) both; }
        .d1 { animation-delay: .06s; } .d2 { animation-delay: .12s; } .d3 { animation-delay: .18s; }
        .d4 { animation-delay: .24s; } .d5 { animation-delay: .3s; } .d6 { animation-delay: .36s; }
        .press { transition: transform .12s ease; }
        .press:active { transform: scale(.97); }

        /* ─── Bibliothèque ─── */
        .lib-head {
            flex: none;
            padding: 18px var(--n-pad-x) 12px;
            padding-top: calc(18px + env(safe-area-inset-top));
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-bottom: 1px solid var(--n-surface-hover);
        }
        .lib-title-row { display: flex; align-items: center; gap: 12px; }
        .lib-title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
        .lib-title h1 {
            margin: 0;
            font-family: var(--n-serif);
            font-size: 34px;
            line-height: 1;
            font-weight: 700;
        }
        .lib-count { align-self: flex-end; font-family: var(--n-mono); font-size: 12px; color: var(--n-text-3); white-space: nowrap; }

        .search {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 48px;
            padding: 0 14px;
            border-radius: var(--n-r-lg);
            background: var(--n-surface);
            border: 1px solid var(--n-border);
        }
        .search:focus-within { border-color: var(--n-violet); }
        .search input {
            flex: 1;
            min-width: 0;
            height: var(--n-tap);
            border: 0;
            outline: none;
            background: transparent;
            color: var(--n-text);
            font-family: var(--n-sans);
            font-size: 16px;
        }
        /* champ en 16px (pas de zoom iOS) ; placeholder plus petit pour tenir en entier */
        .search input::placeholder { color: var(--n-text-3); opacity: 1; font-size: 14px; }
        .search input::-webkit-search-cancel-button { filter: invert(.7); }

        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin: 0 calc(-1 * var(--n-pad-x));
            padding: 4px var(--n-pad-x);
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            position: relative;
            flex: none;
            height: 36px;
            padding: 0 14px;
            border-radius: var(--n-r-pill);
            border: 1px solid var(--n-border);
            background: var(--n-surface);
            color: var(--n-text-2);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        /* zone de tap portée à 44px sans changer le visuel */
        .chip::after { content: ""; position: absolute; left: 0; right: 0; top: -4px; bottom: -4px; }
        .chip[aria-pressed="true"] { background: var(--n-violet); border-color: var(--n-violet); color: var(--n-white); }

        .lib-list {
            flex: 1;
            overflow-y: auto;
            padding: 14px var(--n-pad-x) calc(24px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 18px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .lib-list::-webkit-scrollbar { width: 0; }

        .resume {
            flex: none;
            text-decoration: none;
            color: var(--n-text);
            border-radius: var(--n-r-xl);
            padding: 14px 16px;
            background: var(--n-accent-soft);
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .resume:hover { color: var(--n-text); }
        .resume-icon {
            flex: none;
            width: 40px;
            height: 40px;
            border-radius: var(--n-r-md);
            background: var(--n-violet);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .resume-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .resume-kicker { font-size: 12px; color: var(--n-violet-pale); font-weight: 600; }
        .resume-title { font-size: 16px; font-weight: 700; }
        .resume-progress { font-size: 12px; color: var(--n-text-3); }

        .group { display: flex; flex-direction: column; gap: 6px; }
        .group-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px; }
        .group-head h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--n-violet-light); }
        .group-count { font-family: var(--n-mono); font-size: 11px; color: var(--n-text-3); }
        .group-list {
            list-style: none;
            margin: 0;
            padding: 0;
            border-radius: var(--n-r-lg);
            background: var(--n-surface-2);
            border: 1px solid var(--n-border-2);
            overflow: hidden;
        }
        .group-list li + li { border-top: 1px solid var(--n-border-2); }
        .row {
            min-height: 52px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--n-text);
        }
        a.row:hover { background: var(--n-surface-hover); color: var(--n-text); }
        .row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .row-name { font-size: 15px; font-weight: 600; }
        .row-ready { font-size: 12px; color: var(--n-violet-text); }
        .row-soon .row-name { font-weight: 400; color: var(--n-text-soon); }
        .soon-badge {
            flex: none;
            font-size: 11px;
            font-weight: 600;
            color: var(--n-text-off);
            padding: 3px 8px;
            border-radius: var(--n-r-pill);
            border: 1px solid var(--n-border);
        }

        .empty {
            padding: 40px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
        }
        .empty-title { font-size: 15px; font-weight: 600; }
        .empty-text { font-size: 13px; color: var(--n-text-3); }
        .btn-ghost {
            margin-top: 6px;
            min-height: var(--n-tap);
            padding: 0 18px;
            border-radius: var(--n-r-md);
            border: 1px solid var(--n-border-4);
            background: var(--n-surface);
            color: var(--n-text);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .page-msg {
            margin: auto;
            padding: 24px var(--n-pad-x);
            text-align: center;
            color: var(--n-text-3);
            font-size: 14px;
        }

        /* ─── Fiche ─── */
        .fiche { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        /* Le contenu défile seul si l'écran est trop court ; le bouton Exercice reste en bas */
        .fiche-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 12px var(--n-pad-x) 2px;
            padding-top: calc(12px + env(safe-area-inset-top));
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .fiche-scroll::-webkit-scrollbar { width: 0; }
        .fiche-foot {
            flex: none;
            padding: 10px var(--n-pad-x) calc(16px + env(safe-area-inset-bottom));
        }

        .fiche-head { display: flex; align-items: center; gap: 12px; }
        .fiche-head-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .fiche-head h1 {
            margin: 0;
            font-family: var(--n-serif);
            font-size: 30px;
            line-height: 1;
            font-weight: 700;
        }
        .fiche-summary { margin: 0; font-size: 15px; line-height: 1.45; color: var(--n-text-2); }

        .kb-block { display: flex; flex-direction: column; gap: 8px; }
        .kb-options {
            display: grid;
            gap: 4px;
            padding: 4px;
            border-radius: var(--n-r-md);
            background: var(--n-surface);
            border: 1px solid var(--n-border-3);
        }
        .kb-options button {
            position: relative;
            min-width: 0;
            height: 36px;
            border: 0;
            border-radius: var(--n-r-sm);
            padding: 0 2px;
            background: transparent;
            color: var(--n-text-3);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
        }
        /* zone de tap portée à 44px (le cadre du sélecteur fait 4px de chaque côté) */
        .kb-options button::after { content: ""; position: absolute; left: -2px; right: -2px; top: -4px; bottom: -4px; }
        .kb-options.has-sub button { height: 44px; }
        .kb-options button[aria-pressed="true"] { background: var(--n-violet); color: var(--n-white); }
        .kb-opt-main { line-height: 1.1; }
        .kb-options.has-sub .kb-opt-main { font-family: var(--n-mono); font-size: 12px; font-weight: 500; }
        .kb-opt-sub { font-size: 11px; font-weight: 600; line-height: 1.1; }

        .kb { position: relative; width: 100%; height: 104px; }
        .kb.is-dense { height: 92px; }
        .key {
            position: absolute;
            top: 0;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            font-family: var(--n-mono);
            font-weight: 500;
            color: var(--n-white);
        }
        .key-white {
            height: 100%;
            border-radius: 0 0 7px 7px;
            background: var(--n-key-white);
            padding-bottom: 8px;
            font-size: 13px;
        }
        .kb.is-dense .key-white { border-radius: 0 0 6px 6px; padding-bottom: 7px; font-size: 12px; }
        .key-black {
            z-index: 1;
            height: 60%;
            border-radius: 0 0 5px 5px;
            background: var(--n-key-black);
            border: 1px solid var(--n-bg);
            padding-bottom: 5px;
            font-size: 10px;
        }
        .key-fill {
            position: absolute;
            inset: 0;
            background: var(--n-violet);
            opacity: 0;
            transition: opacity .22s ease;
        }
        .key-label { position: relative; opacity: 0; transition: opacity .22s ease; }
        .key.is-on .key-fill, .key.is-on .key-label { opacity: 1; }
        .kb-caption { margin: 0; font-size: 13px; color: var(--n-text-3); min-height: 1.4em; }

        .section-label {
            font-family: var(--n-mono);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--n-violet-text);
        }
        .essentials { display: flex; flex-direction: column; gap: 6px; }
        .essentials p { margin: 0; font-size: 14px; line-height: 1.4; }
        .essentials strong { color: var(--n-white); }

        .tips {
            border-radius: var(--n-r-xl);
            padding: 12px 16px;
            background: var(--n-accent-soft);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tips-head { display: flex; align-items: center; gap: 8px; }
        .tips-avatar {
            flex: none;
            width: 24px;
            height: 24px;
            border-radius: var(--n-r-pill);
            background: var(--n-violet);
            color: var(--n-white);
            font-family: var(--n-serif);
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tips-head h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--n-violet-light); }
        .tips p { margin: 0; font-size: 14px; line-height: 1.45; }

        .avoid { display: flex; gap: 10px; align-items: flex-start; }
        .avoid svg { flex: none; margin-top: 1px; }
        .avoid p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--n-text-2); }
        .avoid strong { color: var(--n-danger); }

        .btn-primary {
            width: 100%;
            height: 52px;
            border: 0;
            border-radius: var(--n-r-lg);
            background: var(--n-violet);
            color: var(--n-white);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* ─── Panneau d'exercice ─── */
        @keyframes n-fade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes n-sheet { from { transform: translateY(100%); } to { transform: none; } }
        @keyframes n-pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
        .backdrop {
            position: absolute;
            inset: 0;
            z-index: 10;
            background: var(--n-backdrop);
            animation: n-fade .25s ease both;
        }
        .sheet {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 11;
            max-height: 90%;
            overflow-y: auto;
            padding: 12px var(--n-pad-x) calc(24px + env(safe-area-inset-bottom));
            border-radius: var(--n-r-sheet) var(--n-r-sheet) 0 0;
            background: var(--n-surface);
            border-top: 1px solid var(--n-border-4);
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: n-sheet .32s cubic-bezier(.2, .8, .2, 1) both;
        }
        .backdrop[hidden], .sheet[hidden] { display: none; }
        .sheet-handle { flex: none; width: 40px; height: 4px; border-radius: 4px; background: var(--n-handle); align-self: center; }
        .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .sheet-head h2 { margin: 0; font-family: var(--n-serif); font-size: 24px; font-weight: 700; }
        .sheet-head .icon-btn { background: var(--n-bg); }

        .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
        .step {
            width: 100%;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            text-align: left;
            min-height: var(--n-tap);
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--n-text);
            cursor: pointer;
        }
        .step-box {
            flex: none;
            width: 24px;
            height: 24px;
            border-radius: 7px;
            border: 2px solid var(--n-check-border);
            color: var(--n-white);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .step[aria-pressed="true"] .step-box { background: var(--n-violet); border-color: var(--n-violet); }
        .step-box.pop { animation: n-pop .25s ease both; }
        .step-text { font-size: 15px; line-height: 1.45; }

        .related-block { display: flex; flex-direction: column; gap: 8px; padding-top: 6px; border-top: 1px solid var(--n-border-3); }
        .related-block .kicker { color: var(--n-text-3); }
        .related { display: flex; flex-wrap: wrap; gap: 8px; }
        .related a, .related span {
            display: inline-flex;
            align-items: center;
            min-height: var(--n-tap);
            font-size: 13px;
            padding: 0 14px;
            border-radius: var(--n-r-pill);
            border: 1px solid var(--n-border-4);
            text-decoration: none;
        }
        .related a { color: var(--n-text); }
        .related a:hover { color: var(--n-text); background: var(--n-surface-hover); }
        .related span { color: var(--n-text-off); border-style: dashed; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <main id="app" class="app" aria-busy="true"></main>

    <script src="/assets/js/eleve-guard.js"></script>
    <script src="/notions.js"></script>
</body>
</html>
