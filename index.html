    <style>
        /* ── Reset minimal ── */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--mh-font-sans);
            background: var(--mh-bg-base);
            color: var(--mh-text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
        }

        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .mh-container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding: 28px 18px 40px;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .mh-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 24px 0 8px;
        }

        .mh-header .mh-logo {
            width: 56px;
            height: 56px;
        }

        .mh-header .mh-greeting {
            font-family: var(--mh-font-sans);
            font-size: 14px;
            color: var(--mh-text-secondary);
            margin-top: -4px;
        }

        /* ── Hero card (prochaine séance + devoirs fusionnés) ── */
        .mh-hero-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }
        .mh-hero-head .mh-section-label { margin: 0; }
        .mh-hero-head-date {
            font-family: var(--mh-font-sans);
            font-size: 11.5px;
            font-weight: 500;
            color: var(--mh-gold);
            opacity: 0.85;
            font-variant-numeric: tabular-nums;
        }

        .mh-hero-title { margin-bottom: 16px; }
        .mh-hero-progress { margin-bottom: 22px; }
        .mh-hero-devoirs-label { margin-bottom: 0.7rem; }

        /* ── Encart Livrable d'une séance ── */
        .mh-seance-livrable {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: var(--mh-radius-sm);
            background: var(--mh-bg-card);
            border: 1px solid var(--mh-border-card);
            font-family: var(--mh-font-sans);
            font-size: 0.88rem;
            line-height: 1.45;
            color: var(--mh-text-secondary);
        }
        .mh-seance-livrable .mh-section-label { margin: 0 0 4px; }

        .mh-hero-head { flex-wrap: wrap; row-gap: 6px; }
        .mh-hero-head--end { justify-content: flex-end; }
        .mh-hero-resume-link { margin-top: 10px; }

        /* ── Mes séances : une ligne (date + titre) par séance, tout replié ── */
        .mh-seances-list { margin-top: -6px; }
        .mh-seance { border-bottom: 1px solid var(--mh-border-card); }
        .mh-seance:last-child { border-bottom: none; }
        .mh-seance-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            min-height: 48px;
            padding: 8px 0;
            background: none;
            border: none;
            text-align: left;
            cursor: pointer;
            color: inherit;
            scroll-margin-top: 16px;
        }
        .mh-seance { scroll-margin-top: 16px; }
        .mh-seance-row:focus-visible {
            outline: 2px solid var(--mh-violet-border);
            outline-offset: 2px;
            border-radius: var(--mh-radius-sm);
        }
        .mh-seance-row .ti {
            flex-shrink: 0;
            color: var(--mh-text-tertiary);
            transition: transform 200ms ease;
        }
        .mh-seance-row[aria-expanded="true"] .ti { transform: rotate(180deg); }
        .mh-seance-body { padding: 2px 0 16px; }
        .mh-seance-date {
            flex-shrink: 0;
            font-family: var(--mh-font-sans);
            font-size: 11.5px;
            font-weight: 500;
            color: var(--mh-gold);
            font-variant-numeric: tabular-nums;
        }
        .mh-seance-title {
            flex: 1;
            min-width: 0;
            font-family: var(--mh-font-serif);
            font-size: 16px;
            font-weight: 500;
            line-height: 1.25;
            color: var(--mh-text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        @media (prefers-reduced-motion: reduce) {
            .mh-seance-row .ti { transition: none; }
        }
        .mh-seance-devoirs {
            background: var(--mh-gold-tint);
            border: 1px solid var(--mh-gold-border);
            border-radius: var(--mh-radius-sm);
            padding: 12px 14px;
        }
        .mh-seance-devoirs .mh-bullets { margin: 0; }
        .mh-seance-resume { margin-top: 14px; }
        .mh-seance-resume .mh-section-label { margin: 0 0 8px; }
        .mh-seance-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 44px;
            margin-top: 6px;
            padding: 0 2px;
            background: none;
            border: none;
            font-family: var(--mh-font-sans);
            font-size: 13px;
            font-weight: 500;
            color: var(--mh-text-secondary);
            cursor: pointer;
        }
        .mh-seance-toggle:focus-visible {
            outline: 2px solid var(--mh-violet-border);
            outline-offset: 2px;
            border-radius: var(--mh-radius-sm);
        }
        .mh-seance-toggle .ti { transition: transform 200ms ease; }
        .mh-seance-toggle[aria-expanded="true"] .ti { transform: rotate(180deg); }
        @media (prefers-reduced-motion: reduce) {
            .mh-seance-toggle .ti { transition: none; }
        }

        /* ── Empty/error states ── */
        .mh-empty {
            font-family: var(--mh-font-sans);
            font-size: 0.9rem;
            color: var(--mh-text-tertiary);
            line-height: 1.5;
        }

        /* ── Resume card meta ── */
        .mh-meta {
            font-family: var(--mh-font-sans);
            font-size: 12px;
            color: var(--mh-text-tertiary);
            margin: 4px 0 12px;
        }

        /* ── Analyse items ── */
        .mh-sep-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--mh-border-card);
        }
        .mh-sep-item:last-child { border-bottom: none; padding-bottom: 0; }
        .mh-sep-item:first-of-type { padding-top: 0; }
        .mh-sep-title {
            flex: 1;
            min-width: 0;
            font-family: var(--mh-font-sans);
            font-size: 13.5px;
            font-weight: 500;
            color: var(--mh-text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .mh-sep-date {
            font-family: var(--mh-font-sans);
            font-size: 11px;
            color: var(--mh-text-tertiary);
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }
        .mh-sep-open {
            flex-shrink: 0;
            font-family: var(--mh-font-sans);
            font-size: 12px;
            font-weight: 500;
            background: var(--mh-violet-glow);
            color: var(--mh-violet);
            border: 1px solid var(--mh-violet-border);
            border-radius: 8px;
            padding: 5px 11px;
            cursor: pointer;
            transition: background 150ms ease;
        }
        .mh-sep-open:hover { background: rgba(139, 111, 232, 0.22); }
        .mh-sep-group { border-top: 1px solid var(--mh-border-card); }
        .mh-sep-group:first-of-type { border-top: none; }
        .mh-sep-group > summary {
            list-style: none;
            display: flex; align-items: center; gap: 8px;
            min-height: 44px;
            cursor: pointer;
            font-size: 11px; font-weight: 600;
            letter-spacing: .1em; text-transform: uppercase;
            color: var(--mh-text-label);
        }
        .mh-sep-group > summary::-webkit-details-marker { display: none; }
        .mh-sep-group > summary::before {
            content: '›';
            font-size: 15px;
            transition: transform .15s ease;
        }
        .mh-sep-group[open] > summary::before { transform: rotate(90deg); }
        .mh-sep-group-count { opacity: .6; font-weight: 500; }
        .mh-sep-group .mh-sep-item:first-of-type { padding-top: 0; }
        .mh-sep-group[open] { padding-bottom: 10px; }
        @media (prefers-reduced-motion: reduce) {
            .mh-sep-group > summary::before { transition: none; }
        }
        .mh-sep-viewall {
            display: block;
            margin-top: 12px;
            padding: 9px;
            text-align: center;
            color: var(--mh-violet);
            font-family: var(--mh-font-sans);
            font-size: 12.5px;
            text-decoration: none;
            border: 1px solid var(--mh-violet-border);
            border-radius: 10px;
            transition: background 150ms ease;
        }
        .mh-sep-viewall:hover { background: var(--mh-violet-glow); }

        /* ── Impersonation banner (orange conservé, design refined) ── */
        .mh-impersonation-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            background: rgba(251, 146, 60, 0.92);
            color: #1a1a1a;
            padding: 12px 16px;
            border-radius: var(--mh-radius-lg);
            border: 1px solid rgba(251, 146, 60, 0.45);
            font-family: var(--mh-font-sans);
            font-size: 0.86rem;
            font-weight: 500;
            margin-bottom: 16px;
        }
        .mh-impersonation-banner strong { font-weight: 700; }
        .mh-impersonation-banner button {
            background: #1a1a1a;
            color: #FB923C;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .mh-impersonation-banner button:hover  { opacity: 0.85; }
        .mh-impersonation-banner button:disabled { opacity: 0.5; cursor: wait; }

        /* ── Icônes SVG inline (Tabler outline, 1em comme l'ancienne police) ── */
        .ti {
            display: inline-block;
            width: 1em;
            height: 1em;
            flex-shrink: 0;
            vertical-align: -0.125em;
        }

        /* ── Koalendar widget toggle ── */
        .mh-booking-cta-wrap { margin-top: 18px; }
        .mh-koalendar-section {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }
        .mh-koalendar-section.open {
            max-height: 800px;
            opacity: 1;
            margin-top: 10px;
        }
        .mh-koalendar-wrapper {
            background: var(--mh-bg-card);
            border: 1px solid var(--mh-border-card);
            border-radius: var(--mh-radius-lg);
            padding: 16px 8px;
        }
        .mh-koalendar-wrapper iframe { border-radius: 8px; }

        /* ── Login (magic link) ── */
        .mh-login-card {
            width: 100%;
            margin-top: 28px;
            background: var(--mh-bg-card);
            border: 1px solid var(--mh-border-card);
            border-radius: var(--mh-radius-lg);
            padding: 24px 22px;
        }
        .mh-login-title {
            font-family: var(--mh-font-serif);
            font-size: 20px;
            font-weight: 500;
            color: var(--mh-text-primary);
            margin-bottom: 6px;
        }
        .mh-login-lead {
            font-size: 0.88rem;
            color: var(--mh-text-tertiary);
            margin-bottom: 18px;
        }
        .mh-login-form { display: flex; flex-direction: column; gap: 12px; }
        .mh-login-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--mh-text-primary);
            border: 1px solid var(--mh-border-card-strong);
            border-radius: var(--mh-radius-md);
            font-family: var(--mh-font-sans);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .mh-login-input:focus { border-color: var(--mh-gold); }
        .mh-login-input:disabled { opacity: 0.6; }
        .mh-login-status {
            font-size: 0.86rem;
            margin-top: 14px;
            min-height: 1em;
            line-height: 1.45;
            font-family: var(--mh-font-sans);
        }
        .mh-login-status.ok {
            color: #5ecb8b;
            background: rgba(94, 203, 139, 0.08);
            border: 1px solid rgba(94, 203, 139, 0.25);
            padding: 12px 14px;
            border-radius: 10px;
        }
        .mh-login-status.err { color: #f87171; }
        .mh-login-error-msg {
            background: rgba(255, 107, 107, 0.08);
            border: 1px solid rgba(255, 107, 107, 0.25);
            color: #ff8a8a;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 14px;
            line-height: 1.4;
            font-family: var(--mh-font-sans);
        }
        .mh-login-help {
            margin-top: 18px;
            text-align: center;
            font-size: 0.82rem;
            color: var(--mh-text-tertiary);
            font-family: var(--mh-font-sans);
        }
        .mh-login-help a {
            color: var(--mh-gold);
            text-decoration: none;
        }
        .mh-login-help a:hover { text-decoration: underline; }

        /* ── Skeleton loader ── */
        .mh-skeleton {
            height: 12px;
            background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.10), rgba(255,255,255,0.04));
            background-size: 200% 100%;
            border-radius: 6px;
            animation: mh-shimmer 1.4s ease-in-out infinite;
            margin-bottom: 10px;
        }
        @keyframes mh-shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ── Tabler icon size adjustment ── */
        .mh-icon-box .ti { font-size: 22px; }

        /* ── Small-screen tweaks ── */
        @media (max-width: 380px) {
            .mh-container { padding: 22px 14px 32px; }
            .mh-card { padding: 1.1rem; }
        }

        /* ════════════════════════════════════════════════════════
           Onboarding splash (1ère visite — animation de bienvenue)
           ════════════════════════════════════════════════════════ */
        .mh-onboard {
            position: fixed; inset: 0; z-index: 9999;
            background: #0a0a0f;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            opacity: 1;
            transition: opacity 700ms ease-out;
        }
        .mh-onboard.mh-onboard--fade { opacity: 0; }
        .mh-onboard.mh-onboard--fast { transition-duration: 200ms; }
        .mh-onboard.mh-onboard--fade { pointer-events: none; }

        .mh-onboard-inner {
            position: relative; z-index: 1;
            display: flex; flex-direction: column; align-items: center;
            gap: 16px; text-align: center; padding: 24px;
        }
        .mh-onboard-logo, .mh-onboard-logo svg { width: 92px; height: 92px; display: block; }

        /* Phase 1 — construction du logo (éléments masqués au départ) */
        .mh-onboard-logo .ob-circle,
        .mh-onboard-logo .ob-key { opacity: 0; }
        .mh-onboard-logo .ob-key {
            transform: translateY(-10px);
            transform-box: fill-box; transform-origin: center;
        }
        .mh-onboard.play .ob-circle { animation: ob-fade 300ms ease-out forwards; }
        .mh-onboard.play .ob-key    { animation: ob-drop 320ms ease-out forwards; }
        .mh-onboard.play .ob-k1 { animation-delay: 300ms; }
        .mh-onboard.play .ob-k2 { animation-delay: 380ms; }
        .mh-onboard.play .ob-k3 { animation-delay: 460ms; }
        .mh-onboard.play .ob-b1 { animation-delay: 540ms; }
        .mh-onboard.play .ob-b2 { animation-delay: 600ms; }
        @keyframes ob-fade { to { opacity: 1; } }
        @keyframes ob-drop { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* Phase 2 — "Bienvenue" */
        .mh-onboard-welcome {
            font-family: var(--mh-font-serif, 'Cormorant Garamond', Georgia, serif);
            font-size: 28px; font-weight: 500; color: #f5f5f7; letter-spacing: -0.01em;
            opacity: 0; transform: translateY(8px);
        }
        .mh-onboard.play .mh-onboard-welcome { animation: ob-rise 600ms ease-out 1200ms forwards; }
        @keyframes ob-rise { to { opacity: 1; transform: translateY(0); } }

        /* Phase 3 — prénom (typewriter piloté en JS) */
        .mh-onboard-name {
            font-family: var(--mh-font-serif, 'Cormorant Garamond', Georgia, serif);
            font-size: 46px; font-weight: 600; color: var(--mh-gold, #d5b048);
            line-height: 1.1; min-height: 1.1em; letter-spacing: -0.01em;
            opacity: 0;
        }
        .mh-onboard-caret {
            display: inline-block; width: 2px; height: 0.86em; margin-left: 3px;
            background: var(--mh-gold, #d5b048); vertical-align: -0.04em;
            animation: ob-blink 600ms step-end infinite;
        }
        @keyframes ob-blink { 50% { opacity: 0; } }

        /* Phase 4 — particules ambient */
        .mh-onboard-particles { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
        .ob-particle {
            position: absolute; bottom: -24px;
            color: var(--mh-gold, #d5b048); line-height: 1;
            opacity: 0; will-change: transform, opacity;
            animation: ob-float linear forwards;
        }
        @keyframes ob-float {
            0%   { opacity: 0; transform: translateY(0) translateX(0); }
            15%  { opacity: var(--ob-op, 0.5); }
            85%  { opacity: var(--ob-op, 0.5); }
            100% { opacity: 0; transform: translateY(-72vh) translateX(var(--ob-dx, 0)); }
        }

        /* Bouton « ? » replay dans le footer */
        .mh-onboard-replay {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; padding: 0;
            border: 1px solid var(--mh-border-card, rgba(255,255,255,0.12));
            border-radius: 50%;
            background: none; color: var(--mh-text-tertiary, rgba(255,255,255,0.5));
            font-family: var(--mh-font-sans, sans-serif); font-size: 12px; font-weight: 600;
            line-height: 1; cursor: pointer; opacity: 0.4;
            transition: opacity 150ms ease, border-color 150ms ease, color 150ms ease;
        }
        .mh-onboard-replay:hover { opacity: 0.8; color: var(--mh-text-secondary, rgba(255,255,255,0.75)); }

        @media (max-width: 380px) {
            .mh-onboard-name { font-size: 38px; }
            .mh-onboard-welcome { font-size: 24px; }
        }

        /* prefers-reduced-motion : pas d'effets, juste un fondu */
        @media (prefers-reduced-motion: reduce) {
            .mh-onboard .ob-circle,
            .mh-onboard .ob-key,
            .mh-onboard .mh-onboard-welcome {
                opacity: 1 !important; transform: none !important; animation: none !important;
            }
            .mh-onboard .mh-onboard-name { opacity: 1 !important; }
            .mh-onboard-caret, .ob-particle { display: none !important; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div class="mh-container">
        <header class="mh-header mh-fade-in">
            <svg class="mh-logo" width="56" height="56" viewBox="0 0 72 72" aria-hidden="true">
                <circle cx="36" cy="36" r="34" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
                <rect x="16" y="19" width="11.5" height="34" rx="2" fill="#fff"/>
                <rect x="30" y="19" width="11.5" height="34" rx="2" fill="#fff"/>
                <rect x="44" y="19" width="11.5" height="34" rx="2" fill="#fff"/>
                <rect x="24" y="19" width="8" height="21" rx="1.5" fill="#080808"/>
                <rect x="38" y="19" width="8" height="21" rx="1.5" fill="#080808"/>
            </svg>
            <h1 class="mh-title-hero" style="font-size:24px">Master Hub</h1>
            <div class="mh-section-label" style="margin:0">Espace élève</div>
            <div id="greeting"></div>
        </header>
        <div id="content"></div>
        <div id="footer"></div>
    </div>

    <script>
    // ──────────────────────────────────────────────
    //  Helpers
    // ──────────────────────────────────────────────
    function normalize(s) {
        return String(s == null ? "" : s)
            .normalize("NFD")
            .replace(/[̀-ͯ]/g, "")
            .toLowerCase()
            .trim();
    }

    // Élève à partir de son slug. Aucune liste en dur : le serveur valide
    // le slug (KV eleves:list) sur chaque appel /api/eleves/{slug}/…
    function eleveFromSlug(slug) {
        var key = normalize(slug);
        return { slug: key, display: key.charAt(0).toUpperCase() + key.slice(1) };
    }

    // Échappe aussi " et ' : la fonction sert dans des attributs (href, title…).
    function escapeHtml(str) {
        return String(str == null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // Icônes Tabler (outline, MIT) en SVG inline : seules celles utilisées
    // ici, au lieu de la police complète (~900 Ko).
    var ICON_PATHS = {
        'arrow-down': '<path d="M12 5l0 14"/><path d="M18 13l-6 6"/><path d="M6 13l6 6"/>',
        'bolt': '<path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11"/>',
        'book': '<path d="M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0"/><path d="M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0"/><path d="M3 6l0 13"/><path d="M12 6l0 13"/><path d="M21 6l0 13"/>',
        'brand-telegram': '<path d="M15 10l-4 4l6 6l4 -16l-18 7l4 2l2 6l3 -4"/>',
        'calendar-plus': '<path d="M12.5 21h-6.5a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v5"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M4 11h16"/><path d="M16 19h6"/><path d="M19 16v6"/>',
        'chevron-down': '<path d="M6 9l6 6l6 -6"/>',
        'player-play': '<path d="M7 4v16l13 -8z"/>',
        'tool': '<path d="M7 10h3v-3l-3.5 -3.5a6 6 0 0 1 8 8l6 6a2 2 0 0 1 -3 3l-6 -6a6 6 0 0 1 -8 -8l3.5 3.5"/>'
    };
    function icon(name) {
        return '<svg class="ti ti-' + name + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
            'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
            (ICON_PATHS[name] || '') + '</svg>';
    }

    // Parse une date ISO "YYYY-MM-DD" → timestamp ms (minuit local), ou null.
    function parseIsoMs(iso) {
        if (typeof iso !== 'string') return null;
        var m = iso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!m) return null;
        var t = new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10)).getTime();
        return isNaN(t) ? null : t;
    }

    // ──────────────────────────────────────────────
    //  Init — auth magic link (Chantier C)
    //  Si URL = /?eleve={slug} → fetch /api/eleves/{slug}/public avec cookie
    //                          → 200 = render dashboard ; 401 = écran login
    //  Si URL = / → check whoami → si auth, redirect /?eleve={slug} ; sinon écran login
    // ──────────────────────────────────────────────
    var _lastWhoami = null;

    function runInit() {
        var params = new URLSearchParams(window.location.search);
        var initialError = params.get("error");
        if (initialError) {
            params.delete("error");
            var qs = params.toString();
            history.replaceState(null, "", window.location.pathname + (qs ? "?" + qs : ""));
        }
        var slugParam = normalize(params.get("eleve") || "");

        function tryAdminThenRender() {
            return fetch("/api/admin/check", { credentials: "include" })
                .then(function(r) { return r.ok ? r.json() : null; })
                .then(function(jAdmin) {
                    if (jAdmin && jAdmin.ok && slugParam) {
                        var adminEleve = eleveFromSlug(slugParam);
                        renderEspaceEleve(adminEleve);
                        return true;
                    }
                    return false;
                })
                .catch(function() { return false; });
        }

        fetch("/api/auth/whoami", { credentials: "include" })
            .then(function(r) { return r.ok ? r.json() : null; })
            .then(function(j) {
                _lastWhoami = j;
                var authed = j && j.ok;

                if (!authed) {
                    if (slugParam) {
                        return tryAdminThenRender().then(function(ok) {
                            if (!ok) renderLoginEmail(initialError);
                        });
                    }
                    renderLoginEmail(initialError);
                    return;
                }

                if (!j.slug) {
                    if (slugParam) {
                        return tryAdminThenRender().then(function(ok) {
                            if (!ok) renderLoginEmail(initialError);
                        });
                    }
                    renderLoginEmail(initialError);
                    return;
                }
                if (!slugParam || slugParam !== j.slug) {
                    window.location.replace("/?eleve=" + encodeURIComponent(j.slug));
                    return;
                }
                var meEleve = eleveFromSlug(j.slug);
                localStorage.setItem("eleve_slug", meEleve.slug);
                renderEspaceEleve(meEleve);
            })
            .catch(function() {
                if (slugParam) {
                    return tryAdminThenRender().then(function(ok) {
                        if (!ok) renderLoginEmail(initialError);
                    });
                }
                renderLoginEmail(initialError);
            });
    }

    runInit();

    // ──────────────────────────────────────────────
    //  Mode 1 — élève non identifié : login email (magic link)
    // ──────────────────────────────────────────────
    function renderLoginEmail(error) {
        var greeting = document.getElementById("greeting");
        if (greeting) greeting.innerHTML = '';
        var footer = document.getElementById("footer");
        if (footer) footer.innerHTML = '';

        var errorMsg = '';
        if (error === 'expired')           errorMsg = 'Le lien a expiré. Demande un nouveau lien ci-dessous.';
        else if (error === 'missing_token') errorMsg = 'Lien invalide. Demande un nouveau lien ci-dessous.';
        else if (error === 'kv_error')      errorMsg = 'Erreur temporaire. Réessaie dans un instant.';

        var content = document.getElementById("content");
        content.innerHTML =
            '<div class="mh-login-card mh-fade-in">' +
                '<h2 class="mh-login-title">Bienvenue</h2>' +
                '<p class="mh-login-lead">Entre ton email pour recevoir ton lien de connexion.</p>' +
                (errorMsg ? '<div class="mh-login-error-msg">' + escapeHtml(errorMsg) + '</div>' : '') +
                '<form class="mh-login-form" id="login-form" autocomplete="on">' +
                    '<input type="email" class="mh-login-input" id="login-input" placeholder="ton@email.com" autocomplete="email" required aria-label="Email" />' +
                    '<button type="submit" class="mh-btn-primary" id="login-submit">Recevoir mon lien</button>' +
                '</form>' +
                '<div class="mh-login-status" id="login-status" role="status" aria-live="polite"></div>' +
                '<p class="mh-login-help">Pas encore inscrit ? <a href="https://www.bonzai.pro/Lonne/shop/lvgv_2905/piano-master" target="_blank" rel="noopener noreferrer">Découvrir Piano Master</a></p>' +
            '</div>';

        var form = document.getElementById("login-form");
        var input = document.getElementById("login-input");
        var btn = document.getElementById("login-submit");
        var status = document.getElementById("login-status");

        form.addEventListener("submit", function(e) {
            e.preventDefault();
            status.textContent = '';
            status.className = 'mh-login-status';
            var email = (input.value || '').trim().toLowerCase();
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                status.textContent = 'Email invalide.';
                status.className = 'mh-login-status err';
                return;
            }
            btn.disabled = true;
            btn.textContent = 'Envoi…';
            fetch('/api/auth/request-link', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
            .then(function(r) {
                return r.json().catch(function() { return {}; }).then(function(j) {
                    return { ok: r.ok, data: j, status: r.status };
                });
            })
            .then(function(res) {
                if (res.ok && res.data && res.data.ok) {
                    input.disabled = true;
                    btn.style.display = 'none';
                    status.innerHTML = '📧 Email envoyé ! Vérifie ta boîte de réception. Le lien expire dans 15 minutes.';
                    status.className = 'mh-login-status ok';
                } else {
                    var msg = (res.data && res.data.error === 'invalid_email')
                        ? 'Email invalide.'
                        : 'Erreur d\'envoi. Réessaie plus tard.';
                    status.textContent = msg;
                    status.className = 'mh-login-status err';
                    btn.disabled = false;
                    btn.textContent = 'Recevoir mon lien';
                }
            })
            .catch(function() {
                status.textContent = 'Erreur réseau. Réessaie plus tard.';
                status.className = 'mh-login-status err';
                btn.disabled = false;
                btn.textContent = 'Recevoir mon lien';
            });
        });

        setTimeout(function() { try { input.focus(); } catch (e) {} }, 200);
    }

    // ──────────────────────────────────────────────
    //  Mode 2 — élève identifié : dashboard riche
    // ──────────────────────────────────────────────
    function renderEspaceEleve(eleve) {
        _currentEleve = eleve; // mémorisé pour le bouton « ? » replay du footer
        // Animation de bienvenue (1ère visite). Non bloquant : l'overlay se
        // superpose au dashboard qui se construit derrière. Skip si déjà vu.
        maybePlayOnboarding(eleve);

        var greeting = document.getElementById("greeting");
        greeting.innerHTML = '<span class="mh-greeting">Bonjour ' + escapeHtml(eleve.display) + ' 👋</span>';

        var content = document.getElementById("content");
        content.innerHTML =
            '<div id="impersonation-banner-host"></div>' +
            '<div class="mh-stack mh-stagger" style="margin-top:24px">' +
                '<div id="hero-zone"></div>' +
                '<div id="seances-zone"></div>' +
                '<div id="analyse-zone"></div>' +
            '</div>' +
            '<div class="mh-section">' +
                '<div class="mh-section-label">Ressources</div>' +
                '<div class="mh-grid-2 mh-stagger" id="resources-grid"></div>' +
            '</div>' +
            '<div class="mh-booking-cta-wrap" id="booking-cta-wrap"></div>';

        renderImpersonationBanner(eleve);
        renderResourceCards(eleve);
        renderBookingCta(eleve);
        renderFooter();
        renderDynamicSkeleton();
        fetchDashboardData(eleve);
        loadAnalysesForEleve(eleve.slug);
    }

    // ──────────────────────────────────────────────
    //  Onboarding — animation de bienvenue (1ère visite)
    // ──────────────────────────────────────────────
    var _obTimers = [];
    var _currentEleve = null;
    function _obClearTimers() { _obTimers.forEach(clearTimeout); _obTimers = []; }

    // Clone le logo SVG du header (réutilisé, pas dupliqué) et tague ses
    // éléments pour l'animation « construction touche par touche ».
    function _obBuildLogo() {
        var src = document.querySelector('.mh-header .mh-logo');
        var svg = src ? src.cloneNode(true) : null;
        if (!svg) return '';
        svg.removeAttribute('class');
        svg.removeAttribute('width');
        svg.removeAttribute('height');
        var circle = svg.querySelector('circle');
        if (circle) circle.setAttribute('class', 'ob-circle');
        var rects = svg.querySelectorAll('rect');
        var keyClasses = ['ob-key ob-k1', 'ob-key ob-k2', 'ob-key ob-k3', 'ob-key ob-b1', 'ob-key ob-b2'];
        for (var i = 0; i < rects.length; i++) {
            rects[i].setAttribute('class', keyClasses[i] || 'ob-key');
        }
        return svg.outerHTML;
    }

    // Vérifie le statut onboarded (fetch < 500ms sinon skip) puis joue l'anim.
    function maybePlayOnboarding(eleve) {
        if (!eleve || !eleve.slug) return;
        var settled = false;
        var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
        var timeout = setTimeout(function () { if (!settled && ctrl) { try { ctrl.abort(); } catch (e) {} } }, 500);
        fetch('/api/eleves/' + encodeURIComponent(eleve.slug) + '/onboarded',
              { credentials: 'same-origin', signal: ctrl ? ctrl.signal : undefined })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (j) {
                settled = true; clearTimeout(timeout);
                if (j && j.seen === false) {
                    playOnboarding(eleve.display, { markSeen: true, slug: eleve.slug });
                }
            })
            .catch(function () { settled = true; clearTimeout(timeout); /* skip silencieux */ });
    }

    // Joue l'animation. opts.markSeen = true → POST onboarded à la fin
    // (1ère visite). Replay manuel : markSeen falsy → ne touche pas le KV.
    function playOnboarding(displayName, opts) {
        opts = opts || {};
        var name = (typeof displayName === 'string' ? displayName.trim() : '') || 'à toi';
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        var existing = document.getElementById('mh-onboard');
        if (existing) existing.remove();
        _obClearTimers();

        var ov = document.createElement('div');
        ov.id = 'mh-onboard';
        ov.className = 'mh-onboard';
        ov.setAttribute('role', 'dialog');
        ov.setAttribute('aria-label', 'Animation de bienvenue');
        ov.innerHTML =
            '<div class="mh-onboard-particles" aria-hidden="true"></div>' +
            '<div class="mh-onboard-inner">' +
                '<span class="mh-onboard-logo" aria-hidden="true">' + _obBuildLogo() + '</span>' +
                '<div class="mh-onboard-welcome">Bienvenue</div>' +
                '<div class="mh-onboard-name"></div>' +
            '</div>';
        document.body.appendChild(ov);

        var nameEl = ov.querySelector('.mh-onboard-name');
        var finished = false;

        function cleanup(fast) {
            if (finished) return;
            finished = true;
            _obClearTimers();
            document.removeEventListener('keydown', onKey);
            ov.removeEventListener('click', onSkip);
            if (fast) ov.classList.add('mh-onboard--fast');
            ov.classList.add('mh-onboard--fade');
            setTimeout(function () { if (ov && ov.parentNode) ov.parentNode.removeChild(ov); }, (fast ? 200 : 700) + 80);
            if (opts.markSeen && opts.slug) {
                fetch('/api/eleves/' + encodeURIComponent(opts.slug) + '/onboarded',
                      { method: 'POST', credentials: 'same-origin' }).catch(function () {});
            }
        }
        function onSkip() { cleanup(true); }
        function onKey(e) { if (e.key === 'Escape') cleanup(true); }
        ov.addEventListener('click', onSkip);
        document.addEventListener('keydown', onKey);

        if (reduce) {
            // Réduit : pas d'effets, juste "Bienvenue {prénom}" + fondu.
            ov.classList.add('play');
            nameEl.textContent = name;
            _obTimers.push(setTimeout(function () { cleanup(false); }, 1400));
            return;
        }

        requestAnimationFrame(function () { ov.classList.add('play'); });
        // Phase 3 — typewriter du prénom à 2s.
        _obTimers.push(setTimeout(function () {
            nameEl.style.opacity = '1';
            _obTypewrite(nameEl, name, 60);
        }, 2000));
        // Phase 4 — particules à 3.5s.
        _obTimers.push(setTimeout(function () {
            _obSpawnParticles(ov.querySelector('.mh-onboard-particles'));
        }, 3500));
        // Fade-out global à 4.5s (cleanup gère le retrait à ~5.2s).
        _obTimers.push(setTimeout(function () { cleanup(false); }, 4500));
    }
    window.playOnboarding = playOnboarding;

    function _obTypewrite(el, text, speedMs) {
        el.textContent = '';
        var caret = document.createElement('span');
        caret.className = 'mh-onboard-caret';
        el.appendChild(caret);
        var i = 0;
        function step() {
            if (i >= text.length) {
                _obTimers.push(setTimeout(function () { if (caret.parentNode) caret.remove(); }, 700));
                return;
            }
            caret.insertAdjacentText('beforebegin', text.charAt(i));
            i++;
            _obTimers.push(setTimeout(step, speedMs));
        }
        step();
    }

    function _obSpawnParticles(host) {
        if (!host) return;
        var glyphs = ['♪', '♫', '•'];
        for (var i = 0; i < 10; i++) {
            var p = document.createElement('span');
            p.className = 'ob-particle';
            p.textContent = glyphs[i % glyphs.length];
            p.style.left = (Math.random() * 100).toFixed(1) + '%';
            p.style.fontSize = (12 + Math.random() * 8).toFixed(0) + 'px';
            p.style.setProperty('--ob-op', (0.25 + Math.random() * 0.4).toFixed(2));
            p.style.setProperty('--ob-dx', ((Math.random() - 0.5) * 60).toFixed(0) + 'px');
            p.style.animationDuration = (3 + Math.random() * 1.5).toFixed(2) + 's';
            p.style.animationDelay = (Math.random() * 0.8).toFixed(2) + 's';
            host.appendChild(p);
        }
    }

    // Bandeau orange visible si la session courante est issue d'une
    // impersonation admin (cf POST /api/admin/impersonate/:slug).
    function renderImpersonationBanner(eleve) {
        if (!_lastWhoami || !_lastWhoami.isAdminImpersonation) return;
        var host = document.getElementById("impersonation-banner-host");
        if (!host) return;
        var name = _lastWhoami.name || (eleve && eleve.display) || _lastWhoami.slug || '';
        host.innerHTML =
            '<div class="mh-impersonation-banner">' +

                '<button type="button" id="exit-impersonation-btn">Quitter</button>' +

        document.getElementById("exit-impersonation-btn").addEventListener("click", exitImpersonation);

    // ──────────────────────────────────────────────
    //  Analyses (assignées par l'admin)
    // ──────────────────────────────────────────────
    function loadAnalysesForEleve(slug) {
        var zone = document.getElementById("analyse-zone");
        if (!zone) return;
        zone.innerHTML = '';
        fetch('/api/eleves/' + encodeURIComponent(slug) + '/analyse', { credentials: 'include' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (j) {
                if (!j || !j.ok) return;
                var items = Array.isArray(j.items) ? j.items : [];
                renderAnalyses(zone, items, slug, Array.isArray(j.folders) ? j.folders : []);
            })
            .catch(function () { /* silent */ });

    var STEM_LABELS_FR = { vocals: 'Chant', drums: 'Batterie', bass: 'Basse', piano: 'Piano', guitar: 'Guitare', other: 'Autres' };
    var STEM_ORDER_FR = ['vocals', 'drums', 'bass', 'piano', 'guitar', 'other'];
    var STEM_COLORS = {
        vocals: '#A78BFA',
        drums:  '#FB923C',
        bass:   '#34D399',
        piano:  '#60A5FA',
        guitar: '#F87171',
        other:  '#94A3B8',
    };
    var activePlayer = null;

    // Morceaux groupés par dossier du coach (ordre du coach), « Autres »
    // en dernier (sans dossier + anciennes séparations). L'API ne renvoie
    // que les dossiers contenant au moins un morceau de l'élève.
    function groupByFolder(items, folders) {
        var groups = [];
        var byId = {};
        (folders || []).forEach(function (f) {
            var g = { id: f.id, name: f.name, items: [] };
            byId[f.id] = g;
            groups.push(g);
        });
        var autres = { id: '', name: 'Autres', items: [] };
        items.forEach(function (it) {
            (it.folderId && byId[it.folderId] ? byId[it.folderId] : autres).items.push(it);
        });
        groups = groups.filter(function (g) { return g.items.length; });
        if (autres.items.length) groups.push(autres);
        return groups;
    }

    function renderAnalyses(zone, items, slug, folders) {
        if (!items.length) {
            zone.innerHTML =
                '<div class="mh-card">' +
                    '<div class="mh-section-label">Analyse</div>' +
                    '<h3 class="mh-title-section" style="margin-bottom:10px">Aucune analyse</h3>' +
                    '<p class="mh-empty">Aucune analyse pour le moment. Demande à ton coach de t\'en envoyer.</p>' +
                '</div>';
            return;
        }
        var monthsShort = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];

        function fmtDate(ts) {
            if (!ts) return '';
            var d = new Date(ts);
            if (isNaN(d.getTime())) return '';
            return d.getDate() + ' ' + monthsShort[d.getMonth()];
        }
        function truncate(s, max) {
            s = String(s || '');
            return s.length > max ? s.slice(0, max - 1) + '…' : s;
        }

        // 4 morceaux max par section (liste simple sans dossier) ; le reste
        // est sur la page Analyse.
        var PREVIEW_MAX = 4;
        var totalCount = items.length;
        var groups = groupByFolder(items, folders);
        var flat = groups.length === 1 && !groups[0].id;
        var preview = [];
        var hasMore = false;

        function itemsHtml(list) {
            return list.map(function (s) {
                var idx = preview.push(s) - 1;
                return '<div class="mh-sep-item" data-idx="' + idx + '">' +
                    '<span class="mh-sep-title">' + escapeHtml(truncate(s.title || 'Sans titre', 40)) + '</span>' +
                    '<span class="mh-sep-date">' + escapeHtml(fmtDate(s.uploadedAt)) + '</span>' +
                    '<button type="button" class="mh-sep-open" data-id="' + escapeHtml(s.id) + '" aria-label="Ouvrir l\'analyse">▶ Ouvrir</button>' +
                '</div>';
            }).join('');
        }

        var html = '<div class="mh-card">' +
            '<div class="mh-section-label">Analyse</div>' +
            '<h3 class="mh-title-section" style="margin-bottom:14px">Tes morceaux à étudier</h3>';
        groups.forEach(function (g, gi) {
            if (g.items.length > PREVIEW_MAX) hasMore = true;
            var list = itemsHtml(g.items.slice(0, PREVIEW_MAX));
            html += flat ? list
                : '<details class="mh-sep-group"' + (gi === 0 ? ' open' : '') + '>' +
                    '<summary>' + escapeHtml(g.name) + '<span class="mh-sep-group-count">' + g.items.length + '</span></summary>' +
                    list +
                  '</details>';
        });
        if (hasMore) {
            html += '<a class="mh-sep-viewall" href="/analyse?eleve=' + encodeURIComponent(slug) + '">' +
                'Voir tout (' + totalCount + ') →</a>';
        }
        html += '</div>';
        zone.innerHTML = html;

        zone.querySelectorAll('.mh-sep-open').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var idx = parseInt(btn.closest('.mh-sep-item').getAttribute('data-idx'), 10);
                openAnalysePlayer(preview[idx]);
            });
        });
    }

    function openAnalysePlayer(item) {
        if (!item) return;
        if (activePlayer) { try { activePlayer.destroy(); } catch (e) {} activePlayer = null; }

        if (item.legacy === true) {
            openLegacyMultitrackPlayer(item);
            return;
        }
        if (typeof window.AnalysePlayer !== 'function') {
            console.warn('AnalysePlayer non chargé');
            return;
        }
        var type = item.type === 'multitrack' ? 'multitrack' : 'single';
        var trackPrefix = item.trackUrlPrefix
            || ('/api/analyse/' + encodeURIComponent(item.id) + '/stream/');
        var tracks;
        if (type === 'multitrack') {
            var stems = Array.isArray(item.stems) ? item.stems : [];
            tracks = STEM_ORDER_FR
                .filter(function (k) { return stems.indexOf(k) !== -1; })
                .map(function (k) {
                    return {
                        id: k,
                        label: STEM_LABELS_FR[k] || k,
                        color: STEM_COLORS[k] || '#888',
                        url: trackPrefix + k,
                    };
                });
        } else {
            tracks = [{
                id: 'main',
                label: 'Audio',
                color: '#8B6FE8',
                url: item.streamUrl || ('/api/analyse/' + encodeURIComponent(item.id) + '/stream'),
            }];
        }
        activePlayer = new window.AnalysePlayer({
            container: document.body,
            type: type,
            title: item.title || 'Analyse',
            separationId: item.id,
            tracks: tracks,
            readOnly: true,
        });
        activePlayer.open();
    }

    function openLegacyMultitrackPlayer(sep) {
        if (!sep) return;
        if (typeof window.MultitrackPlayer !== 'function') {
            console.warn('MultitrackPlayer non chargé');
            return;
        }

        fetch('/api/stems/' + encodeURIComponent(sep.id) + '/waveforms', { credentials: 'include' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; })
            .then(function (j) {
                var waveforms = (j && j.peaks) ? j.peaks : null;
                var sepStems = Array.isArray(sep.stems) ? sep.stems : [];
                var tracks = STEM_ORDER_FR
                    .filter(function (k) { return sepStems.indexOf(k) !== -1; })
                    .map(function (k) {
                        return {
                            id: k,
                            label: STEM_LABELS_FR[k] || k,
                            color: STEM_COLORS[k] || '#888',
                            url: '/api/stems/' + encodeURIComponent(sep.id) + '/audio/' + k,
                        };
                    });
                activePlayer = new window.MultitrackPlayer({
                    container: document.body,
                    title: sep.title || 'Lecture multipiste',
                    separationId: sep.id,
                    tracks: tracks,
                    waveforms: waveforms,
                    readOnly: true,
                    onWaveformsCalculated: function (peaks) {
                        fetch('/api/stems/' + encodeURIComponent(sep.id) + '/waveforms', {
                            method: 'POST',
                            credentials: 'include',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ peaks: peaks }),
                        }).catch(function () {});
                    },
                });
                activePlayer.open();
            });
    }

    function fetchDashboardData(eleve) {
        fetch('/api/eleves/' + eleve.slug + '/public', { credentials: 'include' })
            .then(function(r) {
                if (r.status === 401) {
                    var err = new Error('unauthorized');
                    err.unauthorized = true;
                    throw err;
                }
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function(data) {
                renderHero(data && data.stats, data && data.derniere_seance);
                fetchSeances(eleve.slug);
                renderResourceCards(eleve, data);
            })
            .catch(function(e) {
                if (e && e.unauthorized) {
                    renderLoginEmail('expired');
                    return;
                }
                console.error('[espace] fetch failed:', e && e.message ? e.message : e);
                document.getElementById("hero-zone").innerHTML =
                    '<div class="mh-card mh-card-hero">' +
                        '<p class="mh-empty">Données momentanément indisponibles. Réessaie plus tard.</p>' +
                    '</div>';
                document.getElementById("seances-zone").innerHTML = '';
            });
    }

    var _lastDerniereSeance = null;
    var _lastStats = null;
    // Historique des séances (plus récente d'abord) ; null = pas encore chargé.
    var _lastSeances = null;
    var _seancesError = false;

    // Liste affichée (plus récente d'abord). Élève suivi avant l'historique :
    // on retombe sur la dernière séance connue (derniere_seance).
    function seancesList() {
        var list = Array.isArray(_lastSeances) ? _lastSeances.slice() : [];
        var d = _lastDerniereSeance;
        if (!list.length && d && (d.titre || (d.resume && d.resume.length) || (d.devoirs && d.devoirs.length))) {
            list.push({ n: null, date: d.date, titre: d.titre, resume: d.resume, devoirs: d.devoirs, livrable: '' });
        }
        return list;
    }

    function cleanList(v) {
        return Array.isArray(v) ? v.filter(Boolean) : [];
    }

    // ──────────────────────────────────────────────
    //  Hero card : dernière séance (devoirs + livrable)
    // ──────────────────────────────────────────────
    function renderHero(stats, derniere) {
        _lastStats = stats || null;
        _lastDerniereSeance = derniere || null;
        var zone = document.getElementById("hero-zone");
        if (!zone) return;
        // Le contenu dépend de l'historique : on garde le squelette tant
        // qu'il n'est pas chargé.
        if (_lastSeances === null && !_seancesError) return;

        if (_seancesError) {
            zone.innerHTML =
                '<div class="mh-card mh-card-hero">' +
                    '<p class="mh-empty">Données momentanément indisponibles. Réessaie plus tard.</p>' +
                '</div>';
            return;
        }

        var list = seancesList();
        var latest = list.length ? list[0] : null;

        // Accompagnement avec fin : « Jusqu'au <date_fin> » + barre de
        // progression (% de temps écoulé entre date_debut et date_fin ;
        // terminé → barre pleine violette). Sans fin : rien de plus.
        var progressHtml = '';
        var headDateHtml = '';
        if (stats && stats.accompagnement !== 'sans_fin') {
            var startMs = parseIsoMs(stats.date_debut);
            var endMs = parseIsoMs(stats.date_fin);
            var pct = 0;
            var over = false;
            if (startMs != null && endMs != null && endMs > startMs) {
                var totalMs = endMs - startMs;
                var nowMs = Date.now();
                over = nowMs > endMs;
                var elapsedMs = Math.min(Math.max(nowMs - startMs, 0), totalMs);
                pct = (elapsedMs / totalMs) * 100;
            } else if (typeof stats.progression_pct === 'number') {
                pct = Math.max(0, Math.min(100, stats.progression_pct));
            }
            if (over) pct = 100;
            var fillClass = 'mh-progress-fill' + (over ? ' mh-progress-fill--over' : '');
            progressHtml = '<div class="mh-progress mh-hero-progress"><div class="' + fillClass + '" style="width:' + pct + '%"></div></div>';
            if (stats.date_fin_label) {
                headDateHtml = '<span class="mh-hero-head-date">Jusqu’au ' + escapeHtml(stats.date_fin_label) + '</span>';
            }
        }

        if (!latest) {
            zone.innerHTML =
                '<div class="mh-card mh-card-hero">' +
                    (headDateHtml ? '<div class="mh-hero-head mh-hero-head--end">' + headDateHtml + '</div>' : '') +
                    '<h2 class="mh-title-hero mh-hero-title">Pas encore de séance publiée</h2>' +
                    progressHtml +
                    '<p class="mh-empty">Tes devoirs apparaîtront ici après ton prochain cours.</p>' +
                '</div>';
            return;
        }

        // « Séance N · <date> » : n de la séance (antérieures incluses),
        // repli sur le compteur des stats.
        var n = latest.n != null ? latest.n
            : (stats && stats.nb_seances != null ? stats.nb_seances : (stats && stats.nb_cours));
        var labelParts = [];
        if (n) labelParts.push('Séance ' + n);
        if (latest.date) labelParts.push(formatDate(latest.date));
        var label = labelParts.length ? labelParts.join(' · ') : 'Dernière séance';
        var titre = latest.titre ? String(latest.titre).trim() : '';

        var devoirs = cleanList(latest.devoirs);
        var devoirsHtml = devoirs.length
            ? bulletsHtml(devoirs, 'gold')
            : '<p class="mh-empty">Aucun devoir spécifique. Continue à pratiquer ce qu\'on a vu en cours.</p>';
        var livrableHtml = latest.livrable
            ? '<div class="mh-seance-livrable"><div class="mh-section-label">Livrable</div>' + escapeHtml(String(latest.livrable)) + '</div>'
            : '';
        var linkHtml = cleanList(latest.resume).length
            ? '<button type="button" class="mh-seance-toggle mh-hero-resume-link" data-open-seance="0">' +
                '<span>Voir le résumé de la séance</span>' + icon('arrow-down') +
              '</button>'
            : '';

        zone.innerHTML =
            '<div class="mh-card mh-card-hero">' +
                '<div class="mh-hero-head">' +
                    '<div class="mh-section-label">' + escapeHtml(label) + '</div>' +
                    headDateHtml +
                '</div>' +
                (titre ? '<h2 class="mh-title-hero mh-hero-title">' + escapeHtml(titre) + '</h2>' : '') +
                progressHtml +
                '<div class="mh-section-label mh-hero-devoirs-label">Devoirs à préparer</div>' +
                devoirsHtml +
                livrableHtml +
                linkHtml +
            '</div>';
        zone.onclick = onHeroResumeLink;
    }

    // « Voir le résumé de la séance » : déplie la séance dans « Mes séances »
    // et défile jusqu'à elle.
    function onHeroResumeLink(e) {
        var btn = e.target.closest ? e.target.closest('[data-open-seance]') : null;
        if (!btn) return;
        var item = document.getElementById('seance-' + btn.getAttribute('data-open-seance'));
        if (!item) return;
        setSeanceOpen(item, true);
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        item.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
        var row = item.querySelector('.mh-seance-row');
        if (row) row.focus({ preventScroll: true });
    }

    // ──────────────────────────────────────────────
    //  Mes séances (historique, tout replié)
    // ──────────────────────────────────────────────
    function fetchSeances(slug) {
        fetch('/api/eleves/' + encodeURIComponent(slug) + '/seances', { credentials: 'include' })
            .then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function (j) {
                _seancesError = false;
                _lastSeances = (j && Array.isArray(j.seances)) ? j.seances : [];
                renderHero(_lastStats, _lastDerniereSeance);
                renderSeances();
            })
            .catch(function (e) {
                console.error('[espace] seances fetch failed:', e && e.message ? e.message : e);
                _seancesError = true;
                renderHero(_lastStats, _lastDerniereSeance);
                var zone = document.getElementById('seances-zone');
                if (zone) zone.innerHTML = '';
            });
    }

    function bulletsHtml(items, accent) {
        var html = '<ul class="mh-bullets mh-bullets-' + accent + '">';
        for (var i = 0; i < items.length; i++) {
            html += '<li>' + escapeHtml(String(items[i])) + '</li>';
        }
        return html + '</ul>';
    }

    // Ligne repliée : date + titre. Dépliée : devoirs → livrable → résumé.
    function seanceItemHtml(s, index) {
        var titre = s.titre ? String(s.titre).trim() : 'Séance';
        var date = s.date ? formatDate(s.date) : '';
        var resume = cleanList(s.resume);
        var devoirs = cleanList(s.devoirs);
        var body = '';
        if (devoirs.length) {
            body += '<div class="mh-seance-devoirs">' +
                '<div class="mh-section-label mh-hero-devoirs-label">Devoirs</div>' +
                bulletsHtml(devoirs, 'gold') +
            '</div>';
        }
        if (s.livrable) {
            body += '<div class="mh-seance-livrable"><div class="mh-section-label">Livrable</div>' + escapeHtml(String(s.livrable)) + '</div>';
        }
        if (resume.length) {
            body += '<div class="mh-seance-resume"><div class="mh-section-label">Résumé</div>' + bulletsHtml(resume, 'violet') + '</div>';
        }
        if (!body) body = '<p class="mh-empty">Pas de détail pour cette séance.</p>';
        var bid = 'seance-body-' + index;
        return '<article class="mh-seance" id="seance-' + index + '">' +
                '<button type="button" class="mh-seance-row" aria-expanded="false" aria-controls="' + bid + '">' +
                    (date ? '<span class="mh-seance-date">' + escapeHtml(date) + '</span>' : '') +
                    '<span class="mh-seance-title">' + escapeHtml(titre) + '</span>' +
                    icon('chevron-down') +
                '</button>' +
                '<div class="mh-seance-body" id="' + bid + '" hidden>' + body + '</div>' +
            '</article>';
    }

    function setSeanceOpen(item, open) {
        var row = item.querySelector('.mh-seance-row');
        var body = item.querySelector('.mh-seance-body');
        if (!row || !body) return;
        row.setAttribute('aria-expanded', open ? 'true' : 'false');
        body.hidden = !open;
    }

    // Déplier / replier une séance (délégation sur la zone)
    function onSeanceToggle(e) {
        var row = e.target.closest ? e.target.closest('.mh-seance-row') : null;
        if (!row) return;
        setSeanceOpen(row.closest('.mh-seance'), row.getAttribute('aria-expanded') !== 'true');
    }

    function renderSeances() {
        var zone = document.getElementById('seances-zone');
        if (!zone) return;
        var list = seancesList();
        // Aucune séance publiée : pas de section (la carte du haut le dit).
        if (!list.length) { zone.innerHTML = ''; return; }
        var html = '<div class="mh-card">' +
            '<div class="mh-hero-head">' +
                '<div class="mh-section-label">Mes séances</div>' +
                '<span class="mh-inline-stat">' + list.length + (list.length > 1 ? ' séances' : ' séance') + '</span>' +
            '</div>' +
            '<div class="mh-seances-list">';
        for (var i = 0; i < list.length; i++) html += seanceItemHtml(list[i], i);
        zone.innerHTML = html + '</div></div>';
        zone.onclick = onSeanceToggle;
    }

    function formatDate(iso) {
        if (!iso) return "";
        var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (!m) return iso;
        var months = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
        return parseInt(m[3], 10) + " " + months[parseInt(m[2], 10) - 1] + " " + m[1];
    }

    // ──────────────────────────────────────────────
    //  Ressources (grid 2-col)
    // ──────────────────────────────────────────────
    function renderResourceCards(eleve, data) {
        var grid = document.getElementById("resources-grid");
        if (!grid) return;
        var slug = eleve.slug;

        var telegramUrl = data && data.links && data.links.telegram;

        var html = '';

        // 1. Telegram — neutral
        if (telegramUrl) {
            html += resourceCardHtml(telegramUrl, 'ti-brand-telegram', 'neutral', 'Telegram', 'Discussions avec Lonne', true);
        }
        // 4. Outils — teal (lien interne)
        html += resourceCardHtml('/outils?eleve=' + encodeURIComponent(slug), 'ti-tool', 'teal', 'Outils', 'Exercices interactifs', false);
        // 4b. Notions — violet (fiches de cours, lien interne)
        html += resourceCardHtml('/notions?eleve=' + encodeURIComponent(slug), 'ti-book', 'violet', 'Notions', 'Fiches de cours', false);
        // 5. Cours vidéo (Bonzai) — pink
        html += resourceCardHtml('https://www.bonzai.pro/Lonne/shop/lvgv_2905/piano-master', 'ti-player-play', 'pink', 'Cours vidéo', 'Accès Bonzai', true);
        // 6. Cours en live (Discord) — gold (id explicite pour le deeplink mobile)
        html += '<a class="mh-card mh-card-stack" id="card-live" href="https://discord.gg/KtJF8dPT" target="_blank" rel="noopener noreferrer" aria-label="Cours en live sur Discord">' +
            '<div class="mh-icon-box gold">' + icon('bolt') + '</div>' +
            '<div class="mh-card-title">Cours en live</div>' +
            '<div class="mh-card-sub">Discord</div>' +
        '</a>';

        grid.innerHTML = html;

        // Discord deeplink sur mobile (fallback web après 800 ms)
        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile) {
            var cardLive = document.getElementById("card-live");
            if (cardLive) {
                cardLive.addEventListener("click", function(e) {
                    e.preventDefault();
                    window.location.href = "discord://channels/KtJF8dPT";
                    setTimeout(function() { window.open("https://discord.gg/KtJF8dPT", "_blank", "noopener"); }, 800);
                });
            }
        }
    }

    function resourceCardHtml(href, iconClass, accent, title, sub, external) {
        var ext = external
            ? ' target="_blank" rel="noopener noreferrer"'
            : '';
        return '<a class="mh-card mh-card-stack" href="' + escapeHtml(href) + '"' + ext + ' aria-label="' + escapeHtml(title) + '">' +
            '<div class="mh-icon-box ' + accent + '">' + icon(iconClass.replace(/^ti-/, '')) + '</div>' +
            '<div class="mh-card-title">' + escapeHtml(title) + '</div>' +
            '<div class="mh-card-sub">' + escapeHtml(sub) + '</div>' +
        '</a>';
    }

    // ──────────────────────────────────────────────
    //  CTA bas — Réserver mon prochain cours (Koalendar inline toggle)
    // ──────────────────────────────────────────────
    // Script Koalendar chargé seulement au premier clic sur « Réserver » :
    // la file d'attente window.Koalendar garde l'appel jusqu'au chargement.
    function loadKoalendar() {
        window.Koalendar = window.Koalendar || function () { (Koalendar.props = Koalendar.props || []).push(arguments); };
        if (document.getElementById('koalendar-widget-js')) return;
        var sc = document.createElement('script');
        sc.id = 'koalendar-widget-js';
        sc.async = true;
        sc.src = 'https://koalendar.com/assets/widget.js';
        document.head.appendChild(sc);
    }

    function renderBookingCta(eleve) {
        var wrap = document.getElementById("booking-cta-wrap");
        if (!wrap) return;
        var koalendarUrl = "https://koalendar.com/e/cours-piano-master?name=" + encodeURIComponent(eleve.display);
        wrap.innerHTML =
            '<button type="button" class="mh-btn-primary" id="booking-cta-btn">' +
                icon('calendar-plus') +
                '<span>Réserver mon prochain cours</span>' +
            '</button>' +
            '<div class="mh-koalendar-section" id="koalendar-section">' +
                '<div class="mh-koalendar-wrapper">' +
                    '<div id="inline-widget-cours-piano-master"></div>' +
                '</div>' +
            '</div>';

        var koalendarInitialized = false;
        var btn = document.getElementById("booking-cta-btn");
        var section = document.getElementById("koalendar-section");
        btn.addEventListener("click", function() {
            var isOpen = section.classList.toggle("open");
            btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            if (isOpen && !koalendarInitialized) {
                koalendarInitialized = true;
                loadKoalendar();
                Koalendar("inline", {
                    "url": koalendarUrl,
                    "selector": "#inline-widget-cours-piano-master"
                });
            }
            if (isOpen) {
                setTimeout(function () { section.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 280);
            }
        });
    }

    // ──────────────────────────────────────────────
    //  Footer (logout)
    // ──────────────────────────────────────────────
    function renderFooter() {
        var footer = document.getElementById("footer");
        footer.innerHTML =
            '<div class="mh-footer">' +
                '<button type="button" id="onboard-replay-btn" class="mh-onboard-replay" aria-label="Revoir l\'animation de bienvenue" title="Revoir l\'animation de bienvenue">?</button>' +
                '<button type="button" id="logout-btn" class="mh-link-muted">Se déconnecter</button>' +
            '</div>';
        document.getElementById("onboard-replay-btn").addEventListener("click", function() {
            // Replay manuel : ne touche pas au KV (markSeen falsy).
            playOnboarding(_currentEleve ? _currentEleve.display : '');
        });
        document.getElementById("logout-btn").addEventListener("click", function() {
            fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
                .catch(function() {})
                .then(function() {
                    localStorage.removeItem("eleve_slug");
                    window.location.href = "/";
                });
        });
    }

    // ──────────────────────────────────────────────
    //  PWA manifest (inline blob)
    // ──────────────────────────────────────────────
    (function() {
        var manifestTag = document.querySelector('script[type="application/manifest+json"]');
        if (!manifestTag) return;
        var blob = new Blob([manifestTag.textContent], { type: "application/json" });
        var link = document.createElement("link");
        link.rel = "manifest";
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
    })();
    </script>

    <script>
    // ──────────────────────────────────────────────
    //  FOND ANIMÉ — touches de piano flottantes
    // ──────────────────────────────────────────────
    (function() {
        var canvas = document.getElementById("bg-canvas");
        var ctx = canvas.getContext("2d");
        var particles = [];
        var COUNT = 18;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        function createParticle() {
            var w = 6 + Math.random() * 4;
            var h = 18 + Math.random() * 10;
            return {
                x: Math.random() * canvas.width,
                y: canvas.height + h,
                w: w,
                h: h,
                r: 2,
                speed: 0.15 + Math.random() * 0.35,
                opacity: 0.04 + Math.random() * 0.04,
                drift: (Math.random() - 0.5) * 0.3
            };
        }

        for (var i = 0; i < COUNT; i++) {
            var p = createParticle();
            p.y = Math.random() * canvas.height;
            particles.push(p);
        }

        function drawRoundRect(x, y, w, h, r, alpha) {
            ctx.globalAlpha = alpha;
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
        }

        var rafId = null;
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (var i = 0; i < particles.length; i++) {
                var p = particles[i];
                p.y -= p.speed;
                p.x += p.drift;
                drawRoundRect(p.x, p.y, p.w, p.h, p.r, p.opacity);
                if (p.y + p.h < 0) {
                    particles[i] = createParticle();
                }
            }
            rafId = requestAnimationFrame(animate);
        }
        animate();
        var stopAnim = function () {
            if (rafId != null) { cancelAnimationFrame(rafId); rafId = null; }
            window.removeEventListener("resize", resize);
        };
        window.addEventListener("beforeunload", stopAnim);
        window.addEventListener("pagehide", stopAnim);
    })();
    </script>
