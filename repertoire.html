    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--mh-bg-base);
            color: var(--mh-text-primary);
            min-height: 100vh; min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            position: relative; overflow-x: hidden;
        }
        #bg-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .container {
            position: relative; z-index: 1;
            max-width: 480px; margin: 0 auto;
            padding: 24px 16px 48px;
            display: flex; flex-direction: column;
            min-height: 100vh; min-height: 100dvh;
        }
        .back-link {
            align-self: flex-start;
            color: var(--mh-text-tertiary);
            font-size: 13px; text-decoration: none;
            padding: 6px 8px; margin-bottom: 8px;
            display: inline-flex; align-items: center; gap: 4px;
            transition: color 0.15s;
        }
        .back-link:hover { color: var(--mh-text-secondary); }
        .header {
            text-align: center; padding: 12px 0 18px;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .header .mh-logo { width: 48px; height: 48px; }
        .header .mh-logo svg { width: 48px; height: 48px; display: block; }
        .header h1 {
            font-family: var(--mh-font-serif);
            font-size: 2rem; font-weight: 500;
            letter-spacing: -0.01em; line-height: 1.15;
            color: var(--mh-text-primary);
        }
        .header .subtitle { font-size: 0.92rem; color: var(--mh-text-tertiary); margin-top: -2px; }
        #filters { margin-bottom: 14px; }
        .mh-empty {
            font-family: var(--mh-font-sans); font-size: 13.5px;
            color: var(--mh-text-tertiary); text-align: center; padding: 8px 0;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <a class="back-link" id="back-link" href="/">← Espace élève</a>

        <header class="header">
            <span class="mh-logo" aria-hidden="true">
                <svg viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="36" cy="36" r="34" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
                    <rect x="16" y="19" width="11.5" height="34" rx="2" fill="#fff"/>
                    <rect x="30" y="19" width="11.5" height="34" rx="2" fill="#fff"/>
                    <rect x="44" y="19" width="11.5" height="34" rx="2" fill="#fff"/>
                    <rect x="24" y="19" width="8" height="21" rx="1.5" fill="#080808"/>
                    <rect x="38" y="19" width="8" height="21" rx="1.5" fill="#080808"/>
                </svg>
            </span>
            <h1>Mon répertoire</h1>
            <p class="subtitle" id="greeting">Bonjour</p>
        </header>

        <div id="filters"></div>
        <div id="list"><p class="mh-empty">Chargement…</p></div>
    </div>

    <script src="/assets/js/repertoire.js"></script>
    <script>
    (function () {
        'use strict';
        var SLUG = null, ALL = [], FILTER = 'all';

        function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
        function setGreeting(name) { document.getElementById('greeting').textContent = 'Bonjour ' + name; }

        function counts() {
            var c = { en_cours: 0, maitrise: 0, bonus: 0 };
            ALL.forEach(function (m) { if (c[m.statut] != null) c[m.statut]++; });
            return c;
        }

        function renderFilters() {
            var c = counts();
            var defs = [['en_cours', 'En cours'], ['maitrise', 'Maîtrisé'], ['bonus', 'Bonus']];
            var host = document.getElementById('filters');
            if (!ALL.length) { host.innerHTML = ''; return; }
            host.className = 'mh-rep-filters';
            host.innerHTML = defs.map(function (d) {
                var active = (FILTER === d[0]) ? ('active ' + d[0]) : '';
                return '<button type="button" class="mh-rep-filter ' + active + '" data-f="' + d[0] + '">' +
                    d[1] + ' <span class="count">· ' + c[d[0]] + '</span></button>';
            }).join('');
            host.querySelectorAll('[data-f]').forEach(function (b) {
                b.addEventListener('click', function () {
                    var f = b.getAttribute('data-f');
                    FILTER = (FILTER === f) ? 'all' : f; // re-clic = désactive le filtre
                    renderFilters(); renderList();
                });
            });
        }

        function rowHtml(m) {
            var bits = [];
            if (m.tonalite) bits.push(MHRep.esc(m.tonalite));
            if (m.date_debut) bits.push('Depuis le ' + MHRep.esc(MHRep.fmtDateFr(m.date_debut)));
            var meta = bits.length ? '<div class="mh-rep-row-meta">' + bits.join(' · ') + '</div>' : '';
            return '<button type="button" class="mh-rep-row" data-rep-id="' + MHRep.esc(m.id) + '">' +
                '<div class="mh-rep-row-main"><div class="mh-rep-row-title">' + MHRep.esc(m.titre) + '</div>' + meta + '</div>' +
                '<span class="mh-rep-badge ' + MHRep.esc(m.statut) + '">' + MHRep.esc(MHRep.statutLabel(m.statut)) + '</span>' +
                '<i class="ti ti-chevron-right mh-chevron-right" aria-hidden="true"></i>' +
            '</button>';
        }

        function renderList() {
            var host = document.getElementById('list');
            if (!ALL.length) {
                host.innerHTML = '<div class="mh-card"><p class="mh-empty">Ton répertoire est vide pour le moment.</p></div>';
                return;
            }
            var items = (FILTER === 'all') ? ALL : ALL.filter(function (m) { return m.statut === FILTER; });
            if (!items.length) {
                host.innerHTML = '<div class="mh-card"><p class="mh-empty">Aucun morceau dans ce statut.</p></div>';
                return;
            }
            host.innerHTML = '<div class="mh-card">' + items.map(rowHtml).join('') + '</div>';
            host.querySelectorAll('[data-rep-id]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var m = ALL.find(function (x) { return x.id === btn.getAttribute('data-rep-id'); });
                    if (m) MHRep.openDetail(SLUG, m);
                });
            });
        }

        function load() {
            fetch('/api/eleves/' + encodeURIComponent(SLUG) + '/repertoire', { credentials: 'same-origin' })
                .then(function (r) {
                    if (r.status === 400) { window.location.replace('/'); return null; }
                    return r.ok ? r.json() : null;
                })
                .then(function (j) {
                    if (!j) { document.getElementById('list').innerHTML = '<p class="mh-empty">Indisponible.</p>'; return; }
                    ALL = (j.ok && Array.isArray(j.morceaux)) ? j.morceaux : [];
                    renderFilters();
                    renderList();
                    // Deep-link ?open=ID → ouvre directement la vue détail.
                    var openId = new URLSearchParams(window.location.search).get('open');
                    if (openId) {
                        var m = ALL.find(function (x) { return x.id === openId; });
                        if (m) MHRep.openDetail(SLUG, m);
                    }
                })
                .catch(function () { document.getElementById('list').innerHTML = '<p class="mh-empty">Indisponible.</p>'; });
        }

        (function init() {
            var params = new URLSearchParams(window.location.search);
            SLUG = (params.get('eleve') || '').toLowerCase().trim();
            if (!SLUG) { window.location.replace('/'); return; }
            document.getElementById('back-link').href = '/' + SLUG;
            setGreeting(cap(SLUG));
            // Nom d'affichage propre si session active (best-effort, non bloquant).
            fetch('/api/auth/whoami', { credentials: 'same-origin' })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (j) { if (j && j.ok && j.slug === SLUG && j.name) setGreeting(j.name); })
                .catch(function () {});
            load();
        })();
    })();
    </script>

    <script>
    // ── Fond animé — touches piano flottantes (cohérent /outils, /analyse) ──
    (function () {
        var canvas = document.getElementById("bg-canvas");
        if (!canvas) return;
        var ctx = canvas.getContext("2d");
        var particles = [];
        var COUNT = 18;
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener("resize", resize);
        resize();
        function mk() {
            var w = 6 + Math.random() * 4, h = 18 + Math.random() * 10;
            return { x: Math.random() * canvas.width, y: canvas.height + h, w: w, h: h, r: 2,
                speed: 0.15 + Math.random() * 0.35, opacity: 0.04 + Math.random() * 0.04, drift: (Math.random() - 0.5) * 0.3 };
        }
        for (var i = 0; i < COUNT; i++) { var p = mk(); p.y = Math.random() * canvas.height; particles.push(p); }
        function rr(x, y, w, h, r, a) {
            ctx.globalAlpha = a; ctx.fillStyle = "#ffffff"; ctx.beginPath();
            ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath(); ctx.fill();
        }
        var rafId = null;
        function anim() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (var i = 0; i < particles.length; i++) {
                var p = particles[i]; p.y -= p.speed; p.x += p.drift; rr(p.x, p.y, p.w, p.h, p.r, p.opacity);
                if (p.y + p.h < 0) particles[i] = mk();
            }
            rafId = requestAnimationFrame(anim);
        }
        anim();
        var stop = function () { if (rafId != null) { cancelAnimationFrame(rafId); rafId = null; } window.removeEventListener("resize", resize); };
        window.addEventListener("beforeunload", stop);
        window.addEventListener("pagehide", stop);
    })();
    </script>
</body>
